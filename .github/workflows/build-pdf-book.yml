name: Build PDF Book

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    env:
      BOOK_VERSION: ${{ github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SUMMARY.md
        run: python scripts/generate_summary.py

      - name: Stamp version into cover SVG and convert to PNG
        run: |
          sed "s|v 4.2026|$BOOK_VERSION|" images/book-cover-template.svg > images/.cover-build.svg
          npx --yes @resvg/resvg-js-cli images/.cover-build.svg images/book-cover-template.png
          rm images/.cover-build.svg

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: '0.4.34'

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser

      - name: Build HTML
        run: mdbook build

      - name: Inject cover and generate PDF
        run: |
          cp images/book-cover-template.png book/cover.png
          sed -i 's|<main>|<main><div style="page-break-after:always;margin:-15mm;padding:0;overflow:hidden"><img src="cover.png" style="width:210mm;height:297mm;object-fit:cover;display:block" /></div>|' book/print.html
          chromium-browser --headless --disable-gpu --no-pdf-header-footer --no-sandbox --print-to-pdf=book.pdf book/print.html

      - name: Upload PDF as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: book.pdf
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./book.pdf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
