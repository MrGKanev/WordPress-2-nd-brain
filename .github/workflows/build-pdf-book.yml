name: Build PDF Book

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    env:
      BOOK_VERSION: ${{ github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify generated table of contents
        run: |
          python3 scripts/generate_summary.py
          git diff --exit-code -- SUMMARY.md

      - name: Cache pinned mdBook
        id: mdbook-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mdbook
          key: mdbook-${{ runner.os }}-${{ hashFiles('.mdbook-version') }}

      - name: Install pinned mdBook version
        shell: bash
        env:
          MDBOOK_CACHE_HIT: ${{ steps.mdbook-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          MDBOOK_VERSION="$(tr -d '[:space:]' < .mdbook-version)"
          MDBOOK_DIR="$RUNNER_TEMP/mdbook"
          mkdir -p "$MDBOOK_DIR"
          if [ "$MDBOOK_CACHE_HIT" != "true" ]; then
            curl --fail --location --silent --show-error \
              "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
              | tar -xz -C "$MDBOOK_DIR"
          fi
          echo "$MDBOOK_DIR" >> "$GITHUB_PATH"

      - name: Build PDF
        run: ./scripts/build-local.sh "$BOOK_VERSION"
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Upload PDF as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: book.pdf
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./book.pdf
          draft: false
          prerelease: false
